name: CI — Tests & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        # Floor is set to the actual current coverage (~9%) so any regression
        # below today's baseline fails CI. Raise this as new tests are added —
        # ideally back to 20% or higher once command modules are covered.
        # Real coverage today: ax_cli/token_cache.py 88%, ax_cli/config.py 46%,
        # ax_cli/client.py 32%, every commands/*.py at 0% (untested CLI surface).
        run: pytest tests/ --cov=ax_cli --cov-report=term-missing --cov-fail-under=9

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: Ruff check
        run: ruff check ax_cli/

      - name: Ruff format check
        run: ruff format --check ax_cli/

  secrets:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # PR range scan needs the base commit present locally

      # Run the pinned TruffleHog image directly (no GitHub API call -> avoids the
      # gitleaks-action@v2 403 on GET /pulls/{n}/commits). Pinned by image DIGEST
      # (immutable; == ghcr.io/...:3.95.6).
      #   PRs:  scan this PR's commit range (base..HEAD) so a secret added then
      #         deleted within the branch is still caught. The base==head case
      #         (which would silently scan nothing) is guarded to a hard failure.
      #   push: scan the merged working tree (filesystem mode).
      # --results=verified,unknown fails on confirmed-live AND format-matched-
      # but-unverifiable secrets (private keys, custom tokens), not verified-only.
      - name: Scan for exposed secrets
        env:
          TH_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:96f8429082cb2d4ae73b1096dcdb2f5aa139881d97042b0c5e5fa226a392e056
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
            test "$BASE" != "$HEAD" || { echo "empty commit range; refusing to scan nothing"; exit 1; }
            docker run --rm -v "${{ github.workspace }}:/repo:ro" "$TH_IMAGE" \
              git file:///repo --since-commit "$BASE" \
              --results=verified,unknown --fail --no-update
          else
            docker run --rm -v "${{ github.workspace }}:/repo:ro" "$TH_IMAGE" \
              filesystem /repo --results=verified,unknown --fail --no-update
          fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package and pip-audit
        run: |
          pip install --upgrade pip setuptools
          pip install -e .
          pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --desc

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

  operator-qa-promotion:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/operator-qa.yml
    with:
      envs: ${{ vars.AX_QA_ENVS || 'dev,next' }}
      target: release
      require_matrix: false
      artifact_name: operator-qa-promotion
    secrets: inherit
